# Weekly dependency updates, grouped to avoid flooding the repo with PRs.
# No auto-merge: reading each changelog is part of the learning (Phase 2 §1).
# Cooldown: only versions published at least 14 days ago are proposed, the
# two-week rule D122 set for actions, now for every dependency (D131).
# Security updates are not delayed.
version: 2
updates:
  # pnpm resolves the whole workspace from the root lockfile, so the root
  # directory covers every app and package. The billing guard function is not
  # part of the workspace (Google builds it with npm), so it has its own entry.
  - package-ecosystem: 'npm'
    directories: ['/', '/infra/gcp/billing-guard']
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Mexico_City'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint does not support TypeScript 7 yet (D115).
      # Remove this rule once typescript-eslint accepts typescript@7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # Node types follow the Node major in .nvmrc (D114, D127): bump them together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The Cloudflare Workers test pool (zip-worker, D107) only supports Vitest 4.
      # Remove this rule once @cloudflare/vitest-pool-workers accepts vitest@5.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
    labels: ['type:chore', 'area:infra']
    commit-message:
      prefix: 'chore(deps)'

  # Workflows live in .github/workflows (covered by '/'); the shared composite
  # action needs its own entry so its pinned SHAs get updated too.
  - package-ecosystem: 'github-actions'
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Mexico_City'
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']
    labels: ['type:chore', 'area:infra']
    commit-message:
      prefix: 'chore(deps)'
