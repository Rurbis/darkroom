# Weekly dependency updates, grouped to avoid flooding the repo with PRs.
# No auto-merge: reading each changelog is part of the learning (Phase 2 §1).
# The npm entry starts working once the monorepo exists (issue #2), and the
# github-actions entry once there are workflows (issue #4). Revisit both then.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ["*"]
    labels: ["type:chore", "area:infra"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    labels: ["type:chore", "area:infra"]
    commit-message:
      prefix: "chore(deps)"
