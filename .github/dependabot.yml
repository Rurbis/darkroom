# Weekly dependency updates, grouped to avoid flooding the repo with PRs.
# No auto-merge: reading each changelog is part of the learning (Phase 2 §1).
# The github-actions entry starts working once there are workflows (issue #4).
version: 2
updates:
  # pnpm resolves the whole workspace from the root lockfile, so the root
  # directory covers every app and package.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Mexico_City'
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # typescript-eslint and ts-jest do not support TypeScript 7 yet (D115).
      # Remove this rule once typescript-eslint accepts typescript@7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # The Cloudflare Workers test pool (zip-worker, D107) only supports Vitest 4.
      # Remove this rule once @cloudflare/vitest-pool-workers accepts vitest@5.
      - dependency-name: 'vitest'
        update-types: ['version-update:semver-major']
    labels: ['type:chore', 'area:infra']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Mexico_City'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    labels: ['type:chore', 'area:infra']
    commit-message:
      prefix: 'chore(deps)'
