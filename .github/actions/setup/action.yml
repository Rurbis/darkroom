# Shared setup for every job: pnpm, Node, dependencies and the Turborepo cache.
# Actions are pinned by commit SHA (a tag can be moved; a SHA cannot) and
# Dependabot keeps them up to date.
name: Setup
description: Install pnpm, Node and the dependencies, and restore the Turborepo cache.

runs:
  using: composite
  steps:
    # Reads the pnpm version from `packageManager` in package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    # Turborepo's local cache: tasks whose inputs did not change replay their
    # logs instead of running again.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
