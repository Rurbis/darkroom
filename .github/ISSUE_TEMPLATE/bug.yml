name: Error
description: Algo que no funciona como debería.
labels: ['type:bug']
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Describe el error. Sin datos personales de clientes ni secretos.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Entorno
      options:
        - Local
        - Staging
        - Producción
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia
      description: Capturas, logs o enlace al evento de Sentry.
