# Local development only (D90, D101). Staging belongs to issue #30.
# Reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "focaldrop-local"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Nest owns business data access (D60). Layer-0 grants/RLS follow in issue #11.
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
# Match CI and staging.
major_version = 17

[db.migrations]
# Application migrations belong to apps/api/drizzle (issue #11).
enabled = false
schema_paths = []

[db.seed]
# The demo agency and owner belong to issue #15.
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324
smtp_port = 54325

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Only provisioned owners can sign in (D94).
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
# Local development does not require email confirmation.
enable_confirmations = false

[auth.sms]
enable_signup = false

# The application uses Nest, R2, and Cloudflare Workers (D56, D101).
# Keep services outside this local Postgres/Auth setup disabled.
[realtime]
enabled = false

[storage]
enabled = false

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
